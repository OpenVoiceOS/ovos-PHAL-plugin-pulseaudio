[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-PHAL-plugin-pulseaudio"
dynamic = ["version"]
description = "A volume control plugin for OpenVoiceOS hardware abstraction layer"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "json_database~=0.7"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-PHAL-plugin-pulseaudio"

[project.entry-points."opm.phal"]
"ovos-PHAL-plugin-pulseaudio" = "ovos_PHAL_plugin_pulseaudio:PulseAudioVolumeControlPlugin"

[tool.setuptools.dynamic]
version = {attr = "ovos_PHAL_plugin_pulseaudio.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_PHAL_plugin_pulseaudio*"]
